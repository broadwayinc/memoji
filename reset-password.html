<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Reset password · memoji</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <script src="https://cdn.jsdelivr.net/npm/skapi-js@2.4.2/dist/skapi.js"></script>
    <script src="service.js"></script>
</head>

<body class="auth-body">
    <main class="auth">
        <div class="auth-card">
            <a class="logo" href="index.html"><span class="logo-paw" aria-hidden="true">🐾</span>memoji</a>
            <h1>Set a new password</h1>
            <p>
                Enter the code from the email and your new password.
                No code? Check your spam folder or <button type="button" class="link-btn" onclick="resendCode(this)">send it again</button>.
            </p>
            <!-- skapi.resetPassword() sets the new password; on success Skapi opens the form's action. -->
            <form action="login.html" onsubmit="resetPassword(event)">
                <label>
                    Email address
                    <input type="email" name="email" placeholder="your@email.com" autocomplete="email" required>
                </label>
                <label>
                    Verification code
                    <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" title="The 6 digit code" placeholder="6 digit code" autocomplete="one-time-code" required>
                </label>
                <label>
                    New password
                    <input type="password" name="new_password" minlength="6" placeholder="At least 6 characters" autocomplete="new-password" required>
                </label>
                <button type="submit" class="btn primary wide">Reset password</button>
            </form>
        </div>
    </main>

    <script>
        let emailInput = document.querySelector("input[name=email]");
        if (location.hash) {
            emailInput.value = decodeURIComponent(location.hash.slice(1));
        }

        async function resendCode(button) {
            let email = emailInput.value;
            if (!email) {
                alert("Enter your email address first.");
                return;
            }
            button.disabled = true;
            try {
                await skapi.forgotPassword({ email });
                alert("A new verification code has been sent.");
            } catch (err) {
                alert(err.message);
            } finally {
                button.disabled = false;
            }
        }

        async function resetPassword(event) {
            event.preventDefault();
            try {
                await skapi.resetPassword(event);
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>

</html>
