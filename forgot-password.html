<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Forgot password · memoji</title>
    <meta name="theme-color" content="#fff8f3">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="memoji">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <script src="https://cdn.jsdelivr.net/npm/skapi-js@2.4.2/dist/skapi.js"></script>
    <script src="service.js"></script>
</head>

<body class="auth-body">
    <main class="auth">
        <div class="auth-card">
            <a class="logo" href="index.html"><span class="logo-paw" aria-hidden="true">🐾</span>memoji</a>
            <h1>Forgot your password?</h1>
            <!-- skapi.forgotPassword() emails a 6 digit code to the account's (verified) email address. -->
            <p>We will email you a 6 digit code to set a new one.</p>
            <form onsubmit="requestPasswordReset(event)">
                <label>
                    Email address
                    <input type="email" name="email" placeholder="your@email.com" autocomplete="email" required>
                </label>
                <button type="submit" class="btn primary wide">Send code</button>
            </form>
            <p class="auth-links"><a href="login.html">Back to login</a></p>
        </div>
    </main>

    <script>
        async function requestPasswordReset(event) {
            event.preventDefault();
            let form = event.target;
            try {
                await skapi.forgotPassword(event);
                // The email address goes to the next page in the URL hash, so it does not have to be typed again.
                location.href = pageUrl("reset-password.html#" + encodeURIComponent(form.elements.email.value));
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>

</html>
