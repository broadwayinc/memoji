<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Offline · memoji</title>
    <meta name="theme-color" content="#fff8f3">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="memoji">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>

<!-- Shown by the service worker when a page is opened without a connection and is not cached yet. -->
<body class="auth-body">
    <main class="auth">
        <div class="auth-card">
            <a class="logo" href="index.html"><span class="logo-paw" aria-hidden="true">🐾</span>memoji</a>
            <img src="icons/icon-192.png" alt="" width="96" height="96" style="display:block;margin:1rem auto;border-radius:24px">
            <h1>You're offline</h1>
            <p>memoji needs a connection to load posts and share photos. It will pick up again as soon as you're back online.</p>
            <button type="button" class="btn primary wide" onclick="location.reload()">Try again</button>
        </div>
    </main>
    <script>
        window.addEventListener("online", () => location.reload());
    </script>
</body>

</html>
