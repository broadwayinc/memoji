<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sign up · memoji</title>
    <meta name="description" content="Snap a photo and every face turns into a cute 3D animal memoji that blinks, smiles and follows your gaze. Share it, like, comment, follow and get notified.">
    <meta name="theme-color" content="#fff8f3">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <!-- Link previews (Open Graph / Twitter). Crawlers need absolute URLs: the app is hosted at https://memoji.skapi.com/ -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="memoji">
    <meta property="og:title" content="Join memoji · every face becomes a cute 3D animal">
    <meta property="og:description" content="Snap a photo and every face turns into a cute 3D animal memoji that blinks, smiles and follows your gaze. Share it, like, comment, follow and get notified.">
    <meta property="og:url" content="https://memoji.skapi.com/signup.html">
    <meta property="og:image" content="https://memoji.skapi.com/og-cover.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="memoji: the app icon, a 3D bunny, beside a phone showing the live camera turning a person's head into a smiling 3D bunny">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Join memoji · every face becomes a cute 3D animal">
    <meta name="twitter:description" content="Snap a photo and every face turns into a cute 3D animal memoji that blinks, smiles and follows your gaze. Share it, like, comment, follow and get notified.">
    <meta name="twitter:image" content="https://memoji.skapi.com/og-cover.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="memoji">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <script src="https://cdn.jsdelivr.net/npm/skapi-js@2.4.2/dist/skapi.js"></script>
    <script src="service.js"></script>
</head>

<body class="auth-body">
    <main class="auth">
        <div class="auth-card">
            <a class="logo" href="index.html"><span class="logo-paw" aria-hidden="true">🐾</span>memoji</a>
            <h1>Create your account</h1>
            <p>Pick a spirit animal, take photos, follow your friends.</p>
            <!--
                skapi.signup() creates the account. With signup_confirmation Skapi emails a confirmation link
                that brings the user to the login page.
            -->
            <form action="signup-success.html" onsubmit="signup(event)">
                <label>
                    Name
                    <input type="text" name="name" placeholder="What should we call you?" autocomplete="nickname" maxlength="40" required>
                </label>
                <label>
                    Email address
                    <input type="email" name="email" placeholder="your@email.com" autocomplete="email" required>
                </label>
                <label>
                    Password
                    <input type="password" name="password" minlength="6" placeholder="At least 6 characters" autocomplete="new-password" required>
                </label>
                <button type="submit" class="btn primary wide">Sign up</button>
            </form>
            <p class="auth-links"><a href="login.html">I already have an account</a></p>
            <p class="source-link"><a href="https://github.com/broadwayinc/memoji" target="_blank" rel="noopener">Open source on GitHub</a></p>
        </div>
    </main>

    <script>
        // A user who is already logged in does not need to sign up. A guest can: signup() logs the guest out first.
        userReady.then((user) => {
            if (user && !user.anonymous) {
                location.replace(pageUrl("index.html"));
            }
        });

        async function signup(event) {
            event.preventDefault();
            try {
                // On success Skapi redirects to the form's action (signup-success.html).
                await skapi.signup(event, { signup_confirmation: pageUrl("login.html") });
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>

</html>
